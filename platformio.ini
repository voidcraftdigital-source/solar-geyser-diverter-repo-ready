; Geyser Diverter — Rev A4 firmware
; See ../SPECIFICATION.md §25 (architecture) and §28 (staged build order).
; This env targets a generic ESP32-S3 dev board for bench testing (V0.1).
; Swap `board` below if PlatformIO doesn't recognize your specific board variant —
; almost any ESP32-S3-WROOM-1 based devkit works fine under esp32-s3-devkitc-1.

[env:esp32-s3-devkit]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.2
